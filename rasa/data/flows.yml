flows:

  # ── Override of a CALM default pattern ─────────────────────────────────────
  # Out of the box pattern_chitchat's only step is `utter_cannot_handle`, so any
  # off-topic message got "I'm sorry, I'm not trained to help with that". Rasa's own
  # default_flows_for_patterns.yml carries the comment "To enable free-form response
  # use: - action: utter_free_chitchat_response" -- which is exactly this swap.
  #
  # action_free_chitchat calls Claude with the employee's actual message, so it can
  # genuinely answer. The NLG rephraser cannot do this -- it only rewords a suggested
  # response and never sees a question. Note this needs NO IntentlessPolicy: the
  # command processor only downgrades ChitChat to cannot_handle when the pattern uses
  # the built-in `action_trigger_chitchat`, which this does not.
  pattern_chitchat:
    description: Conversation repair flow for off-topic interactions that won't disrupt the main conversation
    name: pattern chitchat
    steps:
      - action: action_free_chitchat

  # ── 1. Leave balance ───────────────────────────────────────────────────────
  check_leave_balance:
    description: >
      The employee wants to know how much leave they have left — annual leave
      balance, sick leave balance, remaining days, or entitlement.
    steps:
      - action: action_get_leave_balance

  # ── 2. Apply for leave ─────────────────────────────────────────────────────
  apply_for_leave:
    description: >
      The employee wants to book, apply for, request, or submit a leave request
      into the HRMS. Use this when they are asking to take time off, not when
      they are only asking about policy rules. Use this even when the leave type
      they name is not one we offer -- for example "study leave" or "unpaid
      leave" -- because this flow validates the type and tells them which kinds
      are available. Do not ask for clarification in that case.
    steps:
      - collect: leave_type
        description: >
          The kind of leave requested. Must be exactly one of:
          Annual, Sick, Compassionate, Parental.
        rejections:
          # pypred (Rasa's predicate language) has no list/`in` syntax — a Python
          # `not in [...]` here fails validation with an opaque parser error.
          # This is the equivalent chained-comparison form it actually supports.
          - if: "slots.leave_type != 'Annual' and slots.leave_type != 'Sick' and slots.leave_type != 'Compassionate' and slots.leave_type != 'Parental'"
            utter: utter_invalid_leave_type

      - collect: leave_days
        description: The number of days of leave the employee wants to take.
        rejections:
          - if: "slots.leave_days < 1 or slots.leave_days > 30"
            utter: utter_invalid_leave_days

      - collect: confirm_submit
        description: >
          Whether the employee confirms they want the request submitted.
          True if they agree, False if they decline or want to change something.
        next:
          - if: "slots.confirm_submit"
            then:
              - action: action_submit_leave
                next: END
          - else:
              - action: utter_leave_cancelled
                next: END

  # ── 2b. Cancel a pending leave request ─────────────────────────────────────
  cancel_leave:
    description: >
      The employee wants to cancel, withdraw, or retract a leave request they
      already submitted, while it is still pending manager approval. Not for
      an approved request, and not for starting a new leave application.
    steps:
      - action: action_find_pending_leave
        next:
          - if: "slots.pending_leave_count == 0"
            then:
              - action: utter_no_pending_leave
                next: END
          - if: "slots.pending_leave_count == 1"
            then:
              - collect: confirm_cancel
                description: >
                  Whether the employee confirms they want their one pending
                  leave request cancelled. True if they agree, False if they
                  want to keep it.
                next:
                  - if: "slots.confirm_cancel"
                    then:
                      - action: action_cancel_leave
                        next: END
                  - else:
                      - action: utter_cancel_declined
                        next: END
          - else:
              - collect: leave_to_cancel
                description: >
                  Which pending leave request the employee wants to cancel,
                  described in their own words -- for example the leave type
                  and/or the dates -- since they have more than one pending.
              - action: action_cancel_leave
                next: END

  # ── 3. Compassionate leave / bereavement ───────────────────────────────────
  compassionate_leave:
    description: >
      Someone close to the employee has died, or there is a serious family
      emergency or funeral, or the employee says they need to take compassionate
      leave. They need bereavement support and to know what leave applies. This
      takes priority over generic leave questions.
      Do NOT use this flow when the employee is only asking what the
      compassionate leave policy says -- for example "what is the compassionate
      leave policy?" or "how many days of compassionate leave do we get?" --
      with no sign that a bereavement has actually happened. Use
      policy_question for those, because this flow opens by offering
      condolences, which is wrong for someone simply reading up on the policy.
    steps:
      - collect: relationship
        description: >
          The employee's relationship to the person who died — for example
          mother, father, spouse, child, sibling, grandparent, cousin,
          aunt, uncle.
      - action: action_compassionate_leave

  # ── 4. Parental leave eligibility ──────────────────────────────────────────
  parental_eligibility:
    description: >
      The employee is asking whether they qualify for parental, maternity, or
      paternity leave, or is expecting / has had a baby or adopted a child and
      wants to know their entitlement.
    steps:
      - action: action_check_parental_eligibility

  # ── 5. General policy lookup ───────────────────────────────────────────────
  policy_question:
    description: >
      A general HR policy question that is not about the employee's own leave
      balance or a leave application — for example notice period, resignation,
      performance bonus, expense claims, working from home or hybrid rules, or
      the code of conduct.
    steps:
      - collect: policy_topic
        description: >
          The HR topic being asked about, in a few words, taken from what the
          employee said. For example "notice period", "bonus", "expenses",
          "work from home", "code of conduct".
      - action: action_policy_answer

  # ── 6. Career path advice ──────────────────────────────────────────────────
  career_path_advice:
    description: >
      The employee is asking about moving into a different role or department,
      wants a career development or improvement plan, or is asking what skills,
      certifications, or steps they would need to move from their current role
      into a different one.
    steps:
      - collect: target_department
        description: >
          The department or role the employee wants to move into, in a few
          words, taken from what the employee said. For example "Sales",
          "Engineering", "Product", "Design", "Marketing".
      - action: action_career_path_advice

      # Runs on both outcomes -- a matched plan and an honest "no plan yet" --
      # so the offer to involve HR is always followed through on.
      - collect: confirm_flag_hr
        description: >
          Whether the employee wants this move raised with HR before they act
          on it. True if they agree, False if they would rather not.
        next:
          - if: "slots.confirm_flag_hr"
            then:
              - action: utter_hr_flagged
                next: END
          - else:
              - action: utter_hr_not_flagged
                next: END
