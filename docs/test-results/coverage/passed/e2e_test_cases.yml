test_cases:
- test_case: employee asks for their leave balance
  steps:
  - user: "How many leave days do I have left?"
    assertions:
    - flow_started: check_leave_balance
    - action_executed: action_get_leave_balance

- test_case: bereavement is routed to compassionate leave, not annual leave
  steps:
  - user: "My mother passed away last night"
    assertions:
    - flow_started: compassionate_leave
    - slot_was_set:
      - name: relationship
    - action_executed: action_compassionate_leave

- test_case: extended family bereavement still reaches compassionate leave
  steps:
  - user: "My cousin died, is there leave for this?"
    assertions:
    - flow_started: compassionate_leave
    - slot_was_set:
      - name: relationship
    - action_executed: action_compassionate_leave

- test_case: apply for annual leave end to end
  steps:
  - user: "I want to apply for leave"
    assertions:
    - flow_started: apply_for_leave
  - user: "annual"
    assertions:
    - slot_was_set:
      - name: leave_type
        value: "Annual"
  - user: "3 days"
    assertions:
    - slot_was_set:
      - name: leave_days
        value: 3.0
  - user: "yes please submit it"
    assertions:
    - slot_was_set:
      - name: confirm_submit
        value: true
    - action_executed: action_submit_leave

- test_case: apply for leave in one sentence fills every slot
  steps:
  - user: "Book me 2 days of sick leave"
    assertions:
    - flow_started: apply_for_leave
    - slot_was_set:
      - name: leave_type
        value: "Sick"
      - name: leave_days
        value: 2.0

- test_case: declining confirmation files nothing
  steps:
  - user: "apply for 5 days annual leave"
    assertions:
    - flow_started: apply_for_leave
  - user: "actually no, cancel that"
    assertions:
    - slot_was_set:
      - name: confirm_submit
        value: false
    - bot_uttered:
        utter_name: utter_leave_cancelled

- test_case: invalid leave type is rejected before submission
  steps:
  - user: "I want to apply for study leave"
    assertions:
    - flow_started: apply_for_leave
    - bot_uttered:
        utter_name: utter_invalid_leave_type

- test_case: parental eligibility for a long tenure employee
  steps:
  - user: "Am I eligible for parental leave?"
    assertions:
    - flow_started: parental_eligibility
    - action_executed: action_check_parental_eligibility

- test_case: general policy question routes to the policy lookup
  steps:
  - user: "What is my notice period if I resign?"
    assertions:
    - flow_started: policy_question
    - action_executed: action_policy_answer

- test_case: work from home policy question
  steps:
  - user: "How many days a week can I work from home?"
    assertions:
    - flow_started: policy_question
    - action_executed: action_policy_answer

- test_case: cancelling a leave request with none pending is handled honestly
  steps:
  - user: "I'd like to cancel my pending leave request"
    assertions:
    - flow_started: cancel_leave
    - action_executed: action_find_pending_leave

  # One turn, not two: the command generator fills target_department from the same
  # message that starts the flow, so the action runs immediately. The flow then asks
  # whether to raise the move with HR.
- test_case: career path advice for a defined pair
  steps:
  - user: "What would it take to move into Sales?"
    assertions:
    - flow_started: career_path_advice
    - slot_was_set:
      - name: target_department
        value: "Sales"
    - action_executed: action_career_path_advice
  - user: "yes please raise it with HR"
    assertions:
    - slot_was_set:
      - name: confirm_flag_hr
        value: true
    - bot_uttered:
        utter_name: utter_hr_flagged

- test_case: declining the HR follow-up after career advice
  steps:
  - user: "How do I move into Design?"
    assertions:
    - flow_started: career_path_advice
    - action_executed: action_career_path_advice
  - user: "no thanks, not right now"
    assertions:
    - slot_was_set:
      - name: confirm_flag_hr
        value: false
    - bot_uttered:
        utter_name: utter_hr_not_flagged

  # pattern_chitchat runs action_free_chitchat (which calls Claude), NOT the
  # utter_free_chitchat_response response -- see the override in data/flows.yml.
- test_case: off-topic messages get a chitchat reply, not a flow
  steps:
  - user: "Do you follow the football at all?"
    assertions:
    - flow_started: pattern_chitchat
    - action_executed: action_free_chitchat
