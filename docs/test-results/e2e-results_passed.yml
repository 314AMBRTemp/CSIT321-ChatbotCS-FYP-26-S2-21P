test_results:

- name: employee asks for their leave balance
  pass_status: true
  expected_steps:
  - user: "How many leave days do I have left?"
    assertions:
    - flow_started: check_leave_balance
    - action_executed: action_get_leave_balance

- name: bereavement is routed to compassionate leave, not annual leave
  pass_status: true
  expected_steps:
  - user: "My mother passed away last night"
    assertions:
    - flow_started: compassionate_leave
    - slot_was_set:
      - name: relationship
    - action_executed: action_compassionate_leave

- name: extended family bereavement still reaches compassionate leave
  pass_status: true
  expected_steps:
  - user: "My cousin died, is there leave for this?"
    assertions:
    - flow_started: compassionate_leave
    - slot_was_set:
      - name: relationship
    - action_executed: action_compassionate_leave

- name: apply for annual leave end to end
  pass_status: true
  expected_steps:
  - user: "I want to apply for leave"
    assertions:
    - flow_started: apply_for_leave
  - user: "annual"
    assertions:
    - slot_was_set:
      - name: leave_type
        value: "Annual"
  - user: "3 days"
    assertions:
    - slot_was_set:
      - name: leave_days
        value: 3.0
  - user: "yes please submit it"
    assertions:
    - slot_was_set:
      - name: confirm_submit
        value: true
    - action_executed: action_submit_leave

- name: apply for leave in one sentence fills every slot
  pass_status: true
  expected_steps:
  - user: "Book me 2 days of sick leave"
    assertions:
    - flow_started: apply_for_leave
    - slot_was_set:
      - name: leave_type
        value: "Sick"
      - name: leave_days
        value: 2.0

- name: declining confirmation files nothing
  pass_status: true
  expected_steps:
  - user: "apply for 5 days annual leave"
    assertions:
    - flow_started: apply_for_leave
  - user: "actually no, cancel that"
    assertions:
    - slot_was_set:
      - name: confirm_submit
        value: false
    - bot_uttered:
        utter_name: utter_leave_cancelled

- name: invalid leave type is rejected before submission
  pass_status: true
  expected_steps:
  - user: "I want to apply for study leave"
    assertions:
    - flow_started: apply_for_leave
    - bot_uttered:
        utter_name: utter_invalid_leave_type

- name: parental eligibility for a long tenure employee
  pass_status: true
  expected_steps:
  - user: "Am I eligible for parental leave?"
    assertions:
    - flow_started: parental_eligibility
    - action_executed: action_check_parental_eligibility

- name: general policy question routes to the policy lookup
  pass_status: true
  expected_steps:
  - user: "What is my notice period if I resign?"
    assertions:
    - flow_started: policy_question
    - action_executed: action_policy_answer

- name: work from home policy question
  pass_status: true
  expected_steps:
  - user: "How many days a week can I work from home?"
    assertions:
    - flow_started: policy_question
    - action_executed: action_policy_answer

- name: a compassionate leave policy question is not treated as a bereavement
  pass_status: true
  expected_steps:
  - user: "What is the compassionate leave policy?"
    assertions:
    - flow_started: policy_question
    - action_executed: action_policy_answer

- name: cancelling a leave request with none pending is handled honestly
  pass_status: true
  expected_steps:
  - user: "I'd like to cancel my pending leave request"
    assertions:
    - flow_started: cancel_leave
    - action_executed: action_find_pending_leave

- name: career path advice for a defined pair
  pass_status: true
  expected_steps:
  - user: "What would it take to move into Sales?"
    assertions:
    - flow_started: career_path_advice
    - slot_was_set:
      - name: target_department
        value: "Sales"
    - action_executed: action_career_path_advice
  - user: "yes please raise it with HR"
    assertions:
    - slot_was_set:
      - name: confirm_flag_hr
        value: true
    - bot_uttered:
        utter_name: utter_hr_flagged

- name: declining the HR follow-up after career advice
  pass_status: true
  expected_steps:
  - user: "How do I move into Design?"
    assertions:
    - flow_started: career_path_advice
    - action_executed: action_career_path_advice
  - user: "no thanks, not right now"
    assertions:
    - slot_was_set:
      - name: confirm_flag_hr
        value: false
    - bot_uttered:
        utter_name: utter_hr_not_flagged

- name: off-topic messages get a chitchat reply, not a flow
  pass_status: true
  expected_steps:
  - user: "Do you follow the football at all?"
    assertions:
    - flow_started: pattern_chitchat
    - action_executed: action_free_chitchat
